<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reed · Interaction · 03 Today → answer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
  .app .today { position: absolute; left: 0; right: 0; top: 118px; bottom: 92px; z-index: 3 }
  .app .cta { margin-top: 10px; width: 100%; height: 50px; border-radius: 25px; background: var(--accent); color: #fff; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px }
  .app .cta .ic { width: 18px; height: 18px }
  .app .is-today .thread, .app .is-today .presence { opacity: 0 }
  .app .plan-mini .items li { padding: 5px 0 }
</style>
</head>
<body>
<script>
const { icon, ui, chat } = REED;
const plan = (title, time, rows, cta) => `<div class="card plan"><div class="card-hd"><b>${title}</b><span>${time}</span></div><ul class="items">${rows.map(([n, s]) => `<li>${n}<span class="num">${s}</span></li>`).join('')}</ul><button class="cta">${cta}${icon('arrow', 2)}</button></div>`;
const note = 'Monday was all legs, so today evens it out. About <strong>45 minutes</strong>, rows first.';

REED.page({
  kicker: 'Reed · Interaction · 03',
  title: 'From today to an answer',
  intro: [
    'The most important sequence in the app: you open Reed, it has something for you, you answer. This page specifies the open choreography, the chip becoming your message, the glide, the wait, the reply and a card landing.',
    '<b>After the glide the thread shows only the current chapter</b>: the note you just read and your message. Nothing older appears until you pull for it (page 04). This fixes today’s jump where 20 old messages appear at once.',
  ],
  build(c) {
    c.app.innerHTML = `<canvas class="glow"></canvas>${ui.pulse()}
      <div class="stage">
        <div class="thread"><div class="tscroll">
          <div class="chapter">Today · 9:41</div>
          <div class="voice">${note}</div>
        </div></div>
        <div class="presence"><div class="corner-slot"></div><span class="hint"></span><div class="chips"></div></div>
        ${ui.dock()}
      </div>
      <div class="today">
        <div class="hero"><div class="hero-slot"></div><h2 class="greet">Upper body today.</h2></div>
        <p class="voice center">${note}</p>
        ${plan('Upper body', '~45 min', [['Seated cable row', '3 × 10'], ['Bench press', '3 × 8'], ['Lat pulldown', '3 × 10']], 'Start upper body')}
        ${ui.chips(['Make it shorter', 'Swap bench', 'Not today'], 'center')}
      </div>
      ${ui.mascotLayer()}${REED.keyboard}`;
    c.app.classList.add('is-today');
  },
  async settle(c) {
    await c.placeMascot(c.$('.hero-slot'));
    c.glow.set({ energy: .55, cy: 330, spread: 1.15 });
  },
  steps: [
    {
      t: 'Open: today', u: 'You open the app. Reed has a plan for you.',
      async run(c, { instant }) {
        if (instant) return;
        const parts = [c.$('.greet'), c.$('.today > .voice'), c.$('.today .card'), ...c.$$('.today .chip')];
        parts.forEach(p => (p.style.opacity = 0));
        c.$('.mascot-layer').style.opacity = 0;
        c.glow.set({ energy: 0 }); c.glow.snap(); c.glow.set({ energy: .55 });
        c.face.mood('idle');
        await Promise.all([
          c.anim(c.$('.mascot-layer reed-face'), [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], { dur: REED.springs.gentle.duration, spring: 'gentle' }),
          c.anim(c.$('.mascot-layer'), [{ opacity: 0 }, { opacity: 1 }], { dur: 240 }),
          ...parts.map((p, i) => c.anim(p, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { dur: REED.springs.smooth.duration, spring: 'smooth', delay: 80 + Math.min(i, 3) * 60 + Math.max(0, i - 3) * 40 })),
        ]);
        c.face.act('nod');
        await c.wait(900);
      },
      when: [
        ['0–560', 'Hero mascot fades in and scales .9 → 1 (<code>gentle</code>).'],
        ['0–600', 'Glow fades up to its today level (energy .55, centred behind the hero, cy ≈ 330, spread 1.15).'],
        ['80', 'Greeting rises 8 px and fades in (<code>smooth</code>).'],
        ['140 / 200', 'Note line, then the card.'],
        ['260 →', 'Chips, 40 ms apart.'],
        ['~700', 'Reed gives one small nod: “here’s what I have”.'],
      ],
      spec: [
        'Plays on a cold open and on returning to today mode. Not on every focus of home.',
        'If data isn’t ready, the hero and glow appear first and the content joins when it arrives (same stagger). No spinner.',
        'Content anchors to the bottom, just above the dock (frames 01, 08, 09).',
      ],
      haptic: 'none',
      reduce: 'Everything fades in together (200 ms). No scale, no nod.',
      build: ['<code>today-view.tsx</code>: entering animations with Reanimated <code>FadeInDown</code>-style custom entering (8 px, <code>smooth</code>) and explicit delays.', '<code>reed-glow-field.tsx</code> gets <code>cy</code>/<code>spread</code> from the hero anchor measured by the presence overlay.'],
    },
    {
      t: 'Tap a chip', u: 'You tap “Make it shorter”.',
      async run(c) {
        const chip = c.$$('.today .chip')[0];
        c.haptic('selection');
        await c.anim(chip, [{ transform: 'scale(1)' }, { transform: 'scale(.97)' }], { dur: 90 });
        await c.anim(chip, [{ transform: 'scale(.97)' }, { transform: 'scale(1)' }], { dur: REED.springs.snappy.duration, spring: 'snappy' });
        c.face.mood('listening');
        c.face.gaze(0, .8);
        await c.wait(300);
      },
      when: [
        ['0', 'Press-in: chip scales to .97 (90 ms). Haptic selection.'],
        ['up', 'Release: back to 1 (<code>snappy</code>) and the send starts at once (next step).'],
        ['0', 'Reed looks at the chip.'],
      ],
      spec: ['A chip is a message. It sends immediately with <code>source: \'quick-action\'</code> (existing).', 'Long-press a chip does nothing special in v1 (no hidden editing).'],
      haptic: 'selection',
      reduce: 'No scale; opacity .7 while pressed.',
      build: ['<code>reply-chip.tsx</code>: existing pressable + haptics.selection().'],
    },
    {
      t: 'The glide', u: 'The chip becomes your message and Reed moves to the corner.',
      async run(c) {
        const chip = c.$$('.today .chip')[0];
        const bubble = document.createElement('div');
        bubble.className = 'you';
        bubble.textContent = 'Make it shorter';
        c.$('.tscroll').appendChild(bubble);
        c.app.classList.remove('is-today');
        c.$('.thread').style.opacity = 0;
        c.$('.presence').style.opacity = 1;
        const others = [c.$('.greet'), c.$('.today > .voice'), c.$('.today .card'), ...c.$$('.today .chip').slice(1)];
        c.state('received');
        c.face.mood('listening');
        c.glow.set({ energy: .5, cy: 40, spread: 1 });
        c.glow.wave({ from: 520 });
        await Promise.all([
          c.fly(chip, bubble, { spring: 'lift' }),
          c.placeMascot(c.$('.corner-slot'), { animate: true }),
          ...others.map(o => c.anim(o, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-24px)' }], { dur: 240, easing: 'ease-in' })),
          c.anim(c.$('.thread'), [{ opacity: 0 }, { opacity: 1 }], { dur: 220, delay: 120 }),
        ]);
        c.$('.today').style.display = 'none';
        c.face.mood('thinking');
        c.state('thinking');
        await c.wait(300);
      },
      when: [
        ['0–550', 'Reed glides hero → corner (<code>morph</code>): position and size 112 → 96 together, one continuous arc. Exactly one mascot on screen.'],
        ['0–480', 'The chip lifts into its place as your bubble (<code>lift</code>), widening into the bubble shape.'],
        ['0–240', 'The rest of today (greeting, note, card, other chips) fades and rises 24 px.'],
        ['120–340', 'The thread fades in underneath: the chapter header, the note you just read, your bubble.'],
        ['0–900', 'Glow moves from behind the hero up behind the Pulse (cy 330 → 40) and a wave passes.'],
        ['550', 'Reed lands and turns <code>thinking</code>.'],
      ],
      spec: [
        '<b>The thread after the glide is the current chapter only.</b> Older chapters are not rendered (page 04).',
        'The note from today mode becomes the first message of the chapter, so the conversation reads in order.',
        'Typed messages from today mode do the same, with the composer lift (page 02) instead of the chip.',
      ],
      haptic: 'light (send)',
      reduce: 'Crossfade: today out (120 ms), chat in (200 ms); mascot crossfades between anchors.',
      build: ['Existing glide in <code>presence-mascot.tsx</code> stays; add the chip lift and the chapter-only list.', 'Chip lift: measure chip + target bubble, animate an overlay copy (same layer as the mascot).'],
    },
    {
      t: 'Thinking', u: 'Reed works on it.',
      async run(c) { await chat.thinking(c); await c.wait(1400); },
      when: [
        ['0', 'Mascot <code>thinking</code>, glow breathing (page 01).'],
        ['400', '“Thinking” fades in beside the mascot, only if still waiting.'],
      ],
      spec: ['Nothing in the thread: no typing bubble, no spinner, no filler lines (“ok, let me have a look.” is never shown as a message).'],
      haptic: 'none',
      reduce: 'Static glow; hint appears without fade.',
      build: ['Remove <code>isAgentThinkingMessage</code> rows from the rendered list; their only job now is to set the presence state.'],
    },
    {
      t: 'Reply + card', u: 'Reed answers with a shorter plan.',
      async run(c) {
        await chat.reply(c, 'Done. Three moves, <strong>30 minutes</strong>. Rows and bench stay, pulldowns go.', {
          card: plan('Upper body · short', '~30 min', [['Seated cable row', '3 × 10'], ['Bench press', '3 × 8']], 'Start short upper body'),
        });
        c.face.mood('encouraging');
        await c.wait(700);
      },
      when: [
        ['0 →', 'Sentences reveal (page 01, Speaking).'],
        ['after text', 'Card enters: rises 12 px, scale .96 → 1, fades in (<code>smooth</code>). The thread makes room with the same spring.'],
        ['card lands', 'Haptic light. Mascot <code>encouraging</code>.'],
      ],
      spec: ['Cards never pop in before the text that introduces them.', 'If the reply is only a card, it enters on its own with the same move.'],
      haptic: 'light (card lands)',
      reduce: 'Text and card fade in together.',
      build: ['Widget registry: wrap every widget in one <code>WidgetEnter</code> component that runs this entering animation for fresh messages only.'],
    },
    {
      t: 'Suggestions', u: 'Reed offers what you might say next.',
      async run(c) { await chat.chipsIn(c, ['Start it', 'Swap bench']); },
      when: [['0', 'Chips arrive beside the mascot (page 05).']],
      spec: ['Chips from the reply’s <code>replies</code>; at most 3.'],
      haptic: 'none',
      reduce: 'Fade together.',
      build: ['<code>presence-row.tsx</code>.'],
    },
    {
      t: 'Back later', u: 'You come back after the chapter gap.',
      async run(c, { instant }) {
        if (instant) return;
        c.state('resting');
        await Promise.all([c.anim(c.$('.stage'), [{ opacity: 1 }, { opacity: 0 }], { dur: 200 }), c.anim(c.$('.mascot-layer'), [{ opacity: 1 }, { opacity: 0 }], { dur: 200 })]);
        c.$('.today').style.display = '';
        c.app.classList.add('is-today');
        [c.$('.greet'), c.$('.today > .voice'), c.$('.today .card'), ...c.$$('.today .chip')].forEach(p => { p.style.opacity = ''; p.style.transform = ''; });
        c.$('.greet').textContent = 'Good evening.';
        c.$('.today > .voice').innerHTML = 'You did the short upper session. <strong>2 of 3</strong> this week.';
        c.$('.today .card').outerHTML = `<div class="card"><div class="card-hd"><b>Upper body · short</b><span>Today · 31 min</span></div><div class="bigstats" style="border:0;margin:0;padding-bottom:4px"><div><b class="num">6</b><span>sets</span></div><div><b class="num">58</b><span>reps</span></div><div><b class="num">2,140</b><span>kg moved</span></div></div></div>`;
        c.$('.today .chips').innerHTML = ['How did it go?', 'Plan Friday'].map(l => `<button class="chip">${l}</button>`).join('');
        c.$('.stage').style.opacity = 1;
        await c.placeMascot(c.$('.hero-slot'));
        c.face.mood('happy');
        c.glow.set({ energy: .55, cy: 300, spread: 1.15, breath: 0, speed: 1, warmth: 0 });
        const parts = [c.$('.greet'), c.$('.today > .voice'), c.$('.today .card'), ...c.$$('.today .chip')];
        await Promise.all([
          c.anim(c.$('.mascot-layer'), [{ opacity: 0 }, { opacity: 1 }], { dur: 300 }),
          ...parts.map((p, i) => c.anim(p, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { dur: REED.springs.smooth.duration, spring: 'smooth', delay: 80 + i * 60 })),
        ]);
        await c.wait(900);
      },
      when: [
        ['open', 'Today mode again, with the open choreography from step 1 (no glide back; the switch happens while the app was away).'],
        ['—', 'The conversation above is now the previous chapter. In chat it is one pull away (page 04).'],
      ],
      spec: ['Which mode home opens in uses the same chapter rule as the thread: a new chapter or an unseen coach note → today.'],
      haptic: 'none',
      reduce: 'Fade in.',
      build: ['<code>use-home-mode.ts</code>: replace <code>COLD_AFTER_MS</code> with the server’s chapter boundary (see page 04, 09).'],
    },
  ],
});
</script>
</body>
</html>
