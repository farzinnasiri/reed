<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reed · Interaction · 01 Reed's states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
  .app .failed { opacity: .6 }
  .app .fail-note { align-self: flex-end; font-size: 12.5px; color: var(--ink-3); margin-top: -6px }
  .app .fail-note b { color: var(--accent-ink); font-weight: 600 }
</style>
</head>
<body>
<script>
const { icon, ui, chat } = REED;
REED.page({
  kicker: 'Reed · Interaction · 01',
  title: "Reed's states, in one place",
  intro: [
    'Every reaction in Reed comes from one derived state: <b>resting, listening, following, received, thinking, speaking, waiting on you, concerned</b>. This page walks through them in order on the chat screen, so you can see the mascot, the glow, the composer and the haptics move together.',
    'The rest of the pages reuse exactly these moves. If something here changes, it changes everywhere.',
  ],
  hint: 'Move the pointer over the phone to fake device tilt: the glow shifts a few pixels.',
  build(c) {
    c.app.innerHTML = `<canvas class="glow"></canvas>${ui.pulse()}
      <div class="stage">
        <div class="thread"><div class="tscroll">
          <div class="chapter">Today · 9:12</div>
          <div class="you">How did this week go?</div>
          <div class="voice">Two sessions, both lower body. Squats are up <strong>5 kg</strong> since September, which is the trend we wanted.</div>
        </div></div>
        <div class="presence"><div class="corner-slot"></div><span class="hint"></span><div class="chips"></div></div>
        ${ui.dock()}
      </div>
      ${ui.mascotLayer()}${REED.keyboard}`;
  },
  async settle(c) {
    await c.placeMascot(c.$('.corner-slot'));
  },
  steps: [
    {
      t: 'Resting', u: 'Nothing is happening. You are reading.',
      async run(c) { c.state('resting'); c.face.mood('idle'); c.glow.set({ energy: .35, cy: 40 }); await c.wait(2400); },
      when: [
        ['loop', 'Mascot <code>idle</code>: breathes (scale 1 → 1.025 → 1, 4.8 s), blinks every ~4.4 s with ±0.9 s jitter.'],
        ['loop', 'Glow: three soft blobs drift slowly; one orbit ≈ 30 s. Energy .35, centred just under the Pulse (cy 40).'],
        ['live', 'Tilt the phone: the blobs shift 6–12 px at different depths (parallax). That is the only "3D".'],
      ],
      spec: [
        '<b>ReedGlowField</b> resting props: <code>energy .35 · cy 40 · spread 1 · warmth 0 · breath 0 · speed 1</code>.',
        'The glow sits behind the Pulse and thread in <b>every</b> home state (today and chat). Today mode moves it behind the hero (page 03).',
        'Tilt: <code>DeviceMotion</code> from <code>expo-sensors</code> at 30 Hz, low-pass τ 350 ms, max offsets 6 / 12 / 8 px per blob.',
      ],
      reduce: 'Static glow at resting values: no drift, no tilt. Mascot does not breathe; blinks stay.',
      build: [
        '<code>use-reed-presence.ts</code>: one hook derives the state from composer focus, typed text, pending reply, last reply, send error and live session. Exposes <code>state</code> + a Reanimated shared value.',
        '<code>reed-glow-field.tsx</code>: Skia <code>Canvas</code> with 3 <code>RadialGradient</code> circles (blend <code>plus</code>) driven by shared values; a <code>useFrameCallback</code> advances time.',
        'Pause the frame callback when home is not focused, AppState ≠ active, or Low Power Mode is on.',
      ],
    },
    {
      t: 'Listening', u: 'You tap the composer.',
      async run(c) { await chat.focus(c); await c.wait(700); },
      when: [
        ['0', 'Composer pops: scale 1 → 1.03 in 110 ms, then <code>pop</code> back to 1.'],
        ['0', 'Rim fades in over 180 ms: 1 px accent ring (55 %) + 22 px soft accent glow (28 %).'],
        ['0', 'Session button shrinks 56 → 44, turns <code>surfaceRaised</code>, aligns to the composer baseline (<code>pop</code>). Still tappable.'],
        ['0', 'Keyboard rises; the dock, thread and corner mascot ride it with the keyboard’s own curve.'],
        ['0', 'Mascot → <code>listening</code> (inbound dashes), eyes turn toward the composer.'],
        ['0–350', 'Glow brightens to .5 and leans down (cy 40 → 110).'],
      ],
      spec: [
        'Pop = <code>withSequence(withTiming(1.03, { duration: 110 }), withSpring(1, pop))</code>.',
        'The session button keeps its accessibility label "Start session"; only its size changes.',
        'Everything here reverses on blur (keyboard dismissed or tap outside), same tokens.',
      ],
      haptic: 'none: the keyboard is feedback enough',
      reduce: 'No pop and no size change animation (instant). Rim crossfades 180 ms. Glow jumps to its target.',
      build: [
        '<code>reed-composer.tsx</code>: <code>onFocus</code>/<code>onBlur</code> feed the presence hook.',
        'Rim is a View behind the composer with animated opacity; no Skia needed.',
        'Keyboard: <code>react-native-keyboard-controller</code> (already installed) <code>KeyboardStickyView</code>/<code>useReanimatedKeyboardAnimation</code> so the dock and overlay move on the UI thread.',
      ],
    },
    {
      t: 'Following', u: 'You type.',
      async run(c) { await chat.type(c, 'should I train today or take a rest day?'); await c.wait(400); },
      when: [
        ['1st char', 'Mic morphs into Send: mic scales to .6 and fades (120 ms) while the arrow pops in (<code>pop</code>). Button turns accent.'],
        ['each word', 'Mascot nods (<code>tick</code>: 2.5 px down and back, 200 ms). At most one nod per 450 ms.'],
        ['each word', 'Glow +.06 energy, decays back in 400 ms.'],
        ['—', 'Rim brightens to the typing level (75 % ring, 36 % glow).'],
      ],
      spec: [
        'React on word boundaries (space or punctuation), never per keystroke.',
        'Deleting does nothing except: when the field becomes empty, Send morphs back to mic.',
        'Long text grows the composer up to 5 lines (page 02).',
      ],
      haptic: 'none',
      reduce: 'No nods, no glow pulse. Mic ↔ send crossfade.',
      build: ['Word boundary detection in <code>onChangeText</code> (compare last char), throttled; calls <code>mascot.nod()</code> and <code>glow.pulse(.06)</code>.'],
    },
    {
      t: 'Received', u: 'You tap Send.',
      async run(c) { await chat.send(c); c.face.mood('thinking'); await c.wait(300); },
      when: [
        ['0', 'Haptic light. The composer clears at once and keeps focus.'],
        ['0–480', 'Your text lifts out of the composer into its bubble (<code>lift</code>). The text never scales; the bubble fill fades in during the move and its corners form.'],
        ['0–420', 'The thread rises to make room (<code>smooth</code>).'],
        ['0–900', 'One soft wave of light rises from the dock to the top of the screen.'],
        ['0', 'Mascot hops (12 px up, 420 ms), then turns <code>thinking</code> at 300 ms.'],
      ],
      spec: [
        'The bubble is the optimistic message, keyed by client id. When the server copy arrives nothing re-animates.',
        'Glow wave: an ellipse 1.4 × .45 of a 300 px radial, alpha peaks at .22 mid-way, ease-out cubic.',
      ],
      haptic: 'light (send)',
      reduce: 'Bubble appears in place with a 200 ms fade. No wave, no hop.',
      build: [
        'Lift uses the glide pattern: measure the composer text and the new bubble (<code>measure</code> on the UI thread), animate an absolute copy, reveal the real bubble at the end.',
        '<code>glow.wave()</code> is a one-shot uniform on the Skia field.',
      ],
    },
    {
      t: 'Thinking', u: 'Waiting for Reed. You keep typing.',
      async run(c) { await chat.thinking(c); await c.wait(700); await chat.focus(c); await chat.type(c, 'also my knee feels a bit', { tick: false }); await c.wait(500); },
      when: [
        ['300', 'Mascot <code>thinking</code>: ring with a turning arc, eyes up-left.'],
        ['300', 'Glow breathes: energy ±32 % on a 2.4 s cycle, drift ×2.5, a little warmth (.15).'],
        ['400', '"Thinking" fades in beside the mascot, only if the reply hasn’t landed yet (no flash for fast replies).'],
        ['8 s', 'Hint becomes "Still thinking". Nothing else escalates.'],
        ['—', 'The composer stays usable. Send shows dimmed (waiting); it goes live the moment the reply lands.'],
      ],
      spec: [
        'No Stop button: the backend has no cancel today. If one is added, an empty composer’s button becomes Stop.',
        'Never disable the field or change its placeholder to "Reed is thinking" (today’s behaviour).',
      ],
      haptic: 'none',
      reduce: 'Glow static at .5 with warmth; spinner arc replaced by the ring alone.',
      build: ['State comes from the pending message status already in <code>use-reed-conversation.ts</code>.', 'Queueing a second message is out of scope; Send simply waits.'],
    },
    {
      t: 'Speaking', u: 'The reply arrives.',
      async run(c) { await chat.reply(c, 'Train. Your last two were lower body and you slept fine. Go upper, about <strong>45 minutes</strong>, and keep it moderate.'); await c.wait(600); },
      when: [
        ['0', 'The reply lands whole (no streaming today). The hint fades out (160 ms).'],
        ['0–420', 'The thread makes room (<code>smooth</code>).'],
        ['0 → …', 'Sentences reveal in order: fade + rise 4 px, 180 ms each, 90 ms apart.'],
        ['0', 'Mascot <code>speaking</code> (sound bars), eyes up toward the new text.'],
        ['0–820', 'Glow settles to .45 and stops breathing.'],
        ['0', 'Your waiting Send goes live.'],
      ],
      spec: [
        'Only messages that arrive while you watch reveal. History, pagination and re-renders never animate.',
        'If streaming arrives later, keep the same per-sentence reveal.',
        'The thread stays pinned to the bottom unless you have scrolled up; then the "Latest" pill appears instead (page 04).',
      ],
      haptic: 'none (light only if a card lands, page 03)',
      reduce: 'Whole reply fades in at once (200 ms).',
      build: ['Mark messages as "fresh" when they arrive after mount (createdAt > mountedAt); only fresh ones get the reveal.'],
    },
    {
      t: 'Waiting on you', u: 'The reply ended with suggestions.',
      async run(c) { await chat.chipsIn(c, ['Plan upper body', 'My knee']); },
      when: [
        ['0', 'Chips slide in beside the mascot, 60 ms apart (<code>pop</code>, from 8 px right, scale .94 → 1).'],
        ['0', 'Mascot <code>encouraging</code>, eyes on the chips.'],
        ['1.6 s', 'Mascot returns to <code>idle</code>. Chips stay.'],
      ],
      spec: ['Chip rules (count, length, when they leave) are on page 05.'],
      haptic: 'none',
      reduce: 'Chips fade in together (200 ms).',
      build: ['<code>presence-row.tsx</code> renders chips from the latest Reed message’s <code>replies</code>.'],
    },
    {
      t: 'Concerned', u: 'A send fails.',
      async run(c) {
        const b = await chat.send(c, { pending: false });
        await c.wait(500);
        c.state('concerned');
        b.classList.add('failed');
        const n = document.createElement('div');
        n.className = 'fail-note';
        n.innerHTML = 'Not sent · <b>Retry</b>';
        c.$('.tscroll').appendChild(n);
        await chat.makeRoom(c, n, () => c.anim(n, [{ opacity: 0 }, { opacity: 1 }], { dur: 200 }));
        c.face.mood('concerned');
        c.glow.set({ energy: .22, warmth: 0, breath: 0 });
        c.haptic('warning');
        await c.wait(900);
      },
      when: [
        ['0', 'The send lifts as usual (optimistic).'],
        ['on error', 'Bubble dims to 60 %. Under it: "Not sent · Retry" (Retry in accent ink). Tap anywhere on the bubble retries.'],
        ['on error', 'Mascot <code>concerned</code>; glow dims to .22.'],
        ['retry', 'Bubble returns to 100 %, state goes back to Thinking.'],
      ],
      spec: ['One error state for all send failures; offline shows the same row with "Waiting for connection" and retries on reconnect.'],
      haptic: 'warning (notification), once per failure',
      reduce: 'Same, without the mascot transition.',
      build: ['Existing retry action; this is styling plus the presence state.'],
    },
  ],
});
</script>
</body>
</html>
